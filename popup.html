<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Smart Autofill</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      padding: 12px;
      width: 340px;
      background: #f5f5f5;
      margin: 0;
    }

    h3 {
      margin: 12px 0 8px 0;
      font-size: 14px;
      color: #333;
      border-bottom: 2px solid #2196F3;
      padding-bottom: 6px;
    }

    h4 {
      margin: 10px 0 6px 0;
      font-size: 12px;
      color: #666;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 6px;
      margin-bottom: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
    }

    button {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      border: none;
      border-radius: 5px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    #save {
      background: #4CAF50;
      color: white;
      margin-bottom: 10px;
    }

    .fill-buttons {
      display: flex;
      gap: 6px;
      margin: 8px 0;
    }

    .fill-buttons button {
      flex: 1;
      padding: 7px 4px;
      font-size: 12px;
      margin: 0;
    }

    .field-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
    }

    .field-row input {
        flex: 1;
    }

   .match-score {
    min-width: 46px;
    height: 24px;
    border-radius: 6px;
    background: #1e1e1e;
    color: #4CAF50;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #333;
    visibility: hidden;
    transition: 0.2s ease;
    flex-shrink: 0;
    }
    #fillEmpty {
      background: #2196F3;
      color: white;
    }

    #fillForce {
      background: #FF9800;
      color: white;
    }

    #preview {
      background: #9C27B0;
      color: white;
    }

    #clearFilled {
      background: #e53935;
      color: white;
    }

    .info-text {
      font-size: 11px;
      color: #777;
      margin: 6px 0;
    }

    .divider {
      height: 1px;
      background: #ddd;
      margin: 8px 0;
    }
  </style>
</head>

<body>

<h3>📝 User Data</h3>


<div class="field-row">
  <input id="name" placeholder="Full Name">
  <span class="match-score" id="score-name"></span>
</div>
<div class="field-row">
  <input id="email" placeholder="Email Address">
  <span class="match-score" id="score-email"></span>
</div>
<div class="field-row">
  <input id="phone" placeholder="Phone Number">
  <span class="match-score" id="score-phone"></span>
</div>
<div class="field-row">
  <input id="age" placeholder="Age">
  <span class="match-score" id="score-age"></span>
</div>

<div class="field-row">
  <input id="college" placeholder="College / University">
  <span class="match-score" id="score-college"></span>
</div>
<div class="field-row">
  <input id="cgpa" placeholder="CGPA / GPA">
  <span class="match-score" id="score-cgpa"></span>
</div>
<div class="field-row">
  <input id="tenth" placeholder="10th Percentage">
  <span class="match-score" id="score-tenth"></span>
</div>
<div class="field-row">
  <input id="twelfth" placeholder="12th Percentage">
  <span class="match-score" id="score-twelfth"></span>
</div>

<div class="field-row">
  <input id="country" placeholder="Country">
  <span class="match-score" id="score-country"></span>
</div>
<div class="field-row">
  <input id="state" placeholder="State">
  <span class="match-score" id="score-state"></span>
</div>
<div class="field-row">
  <input id="district" placeholder="District / City">
  <span class="match-score" id="score-district"></span>
</div>
<div class="field-row">
  <input id="address" placeholder="Full Address">
  <span class="match-score" id="score-address"></span>
</div>

<div class="field-row">
  <input id="gender" placeholder="Gender">
  <span class="match-score" id="score-gender"></span>
</div>
<div class="field-row">
  <input id="dob" placeholder="Date of Birth (YYYY-MM-DD)">
  <span class="match-score" id="score-dob"></span>
</div>
<div class="field-row">
  <input id="branch" placeholder="Branch / Stream">
  <span class="match-score" id="score-branch"></span>
</div>
<div class="field-row">
  <input id="skills" placeholder="Skills (comma-separated)">
  <span class="match-score" id="score-skills"></span>
</div>
<div class="field-row">
  <input id="linkedin" placeholder="LinkedIn Profile URL">
  <span class="match-score" id="score-linkedin"></span>
</div>
<div class="field-row">
  <input id="github" placeholder="GitHub Profile URL">
  <span class="match-score" id="score-github"></span>
</div>
<div class="field-row">
  <input id="pincode" placeholder="Pincode / Zip Code">
  <span class="match-score" id="score-pincode"></span>
</div>


<button id="save">💾 Save Data</button>
<button id="exportData">Export Saved Data⬇️</button>
<button id="importData">Import Saved Data⬆️</button>
<input id="importFile" type="file" accept="application/json,.json" hidden>

<div class="divider"></div>

<h3>🎯 Fill Form</h3>

<div class="fill-buttons">
  <button id="fillEmpty" title="Fill only empty fields (recommended)">Fill Empty</button>
  <button id="fillForce" title="Overwrite all fields">Force Fill</button>
  <button id="preview" title="Preview without filling">Preview</button>
</div>

<p class="info-text">
  <strong>Fill Empty:</strong> Fills only empty fields<br>
  <strong>Force Fill:</strong> Overwrites all fields<br>
  <strong>Preview:</strong> Shows where data would go
</p>

<div class="divider"></div>

<h3>&#129529; Clear Filled Fields</h3>

<button id="clearFilled">
  Clear Autofilled Fields
</button>


<script src="popup.js"></script>

</body>
</html>
